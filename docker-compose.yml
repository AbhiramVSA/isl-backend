services:
  isl-backend:
    build: .
    image: isl-backend
    container_name: isl-backend
    restart: unless-stopped
    ports:
      # Host port 8100 -> container port 8000. This is the port to give the
      # sysadmin for the domain mapping. Override with ISL_PORT (shell env or
      # a .env file next to this compose file), e.g. ISL_PORT=9000.
      - "${ISL_PORT:-8100}:8000"
    environment:
      # Lock down to the frontend origin once the domain exists,
      # e.g. CORS_ORIGINS=https://isl.example.org
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Bare names are passed through only when set in the shell or in the .env
      # file next to this compose file (.env is not baked into the image).
      - SECRET_KEY
      - ACCESS_TOKEN_TTL_MINUTES
      - NVIDIA_NIM_API_KEY
      - NIM_DEFAULT_MODEL
      - STATIONS_FILE
    volumes:
      # SQLite database (users, reports). A named volume so it survives
      # `docker compose up -d --build`; `docker compose down -v` deletes it.
      - isl-data:/data
    # One GPU is plenty for this model; needs nvidia-container-toolkit on the
    # host. GET /health lists the GPUs the app actually sees.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  isl-data:
