services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    depends_on: [redis]
  api:
    image: ghcr.io/itskryxen/sign-lang-backend:latest
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/incident.db
      UPLOAD_DIR: /data/uploads
      RECORDING_DIR: /data/recordings
      LIVEKIT_URL: ws://livekit:7880
      ISL_RECOGNITION_URL: ${ISL_RECOGNITION_URL:-http://isl:8000}
    ports: ["8000:8000"]
    volumes:
      - api-data:/data
      - ./backend/recordings:/data/recordings
    depends_on: [redis, livekit, isl]
  isl:
    build:
      context: ./isl-recognition-safety
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu126}
    image: isl-recognition-safety:latest
    environment:
      ISL_DEVICE: ${ISL_DEVICE:-auto}
      ISL_MODELS_DIR: /app/models
    volumes:
      - ./isl-recognition-safety/models:/app/models
    expose: ["8000"]
    shm_size: "2g"
  egress:
    image: livekit/egress:latest
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ./backend/recordings:/out
    depends_on: [redis, livekit]
volumes:
  redis-data:
  api-data:
