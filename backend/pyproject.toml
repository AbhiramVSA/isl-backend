[project]
name = "incident-platform"
version = "0.1.0"
description = "Operational incident reporting API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy[asyncio]>=2.0.41",
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "pydantic-settings>=2.10",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
  "livekit-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "httpx>=0.28", "ruff>=0.12"]

[project.scripts]
incident-seed = "app.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008", "BLE001"]
